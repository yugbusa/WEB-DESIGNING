<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;


        }
        .main {
            width: 100%;
            height: 100%;
            display: flex;
            
        }
        .box {
            width: 200px;
            height: 200px;
            background-color: red;
            animation: changeColor 10s ;
        }
        .box1 {
            width: 200px;
            height: 200px;
            background-color: red;
            animation: move 10s ;
            border: 1px solid black;
            position:absolute ;
            
        }
        .box2 {
            width: 200px;
            height: 200px;
            background-color: red;
            animation: delay 10s;
            border: 1px solid black;
             position:absolute ;
            animation-delay: 2s;
           
        }
        @keyframes changeColor {
           from {
                background-color: red;
            }
            to {
                background-color: yellow;
            }
           
        }
        @keyframes move {
            0% {
               margin-top: 0px;
               margin-left: 0px;
            }
            25% {
               margin-top: 0px;
                margin-left: calc(100vw - 200px);
            }
            50% {
                margin-top: calc();
                margin-left: calc(100vw - 200px); 
            }
            75% {
               margin-top: calc(100vw - 200px);
                margin-left: 0px;
            }
            100% {
                margin-top: 0px;
                margin-left: 0px;
            }
        }
        @keyframes move {
            0% {
               margin-top: 0px;
               margin-left: 0px;
            }
            25% {
               margin-top: 0px;
                margin-left: calc(100vw - 200px);
            }
            50% {
                margin-top: calc();
                margin-left: calc(100vw - 200px); 
            }
            75% {
               margin-top: calc(100vw - 200px);
                margin-left: 0px;
            }
            100% {
                margin-top: 0px;
                margin-left: 0px;
            }
        }
            @keyframes delay {
                0% {
                margin-top: 0px;
                margin-left: 0px;
                }
                25% {
                margin-top: 0px;
                    margin-left: calc(100vw - 200px);
                }
                50% {
                    margin-top: calc();
                    margin-left: calc(100vw - 200px); 
                }
                75% {
                margin-top: calc(100vw - 200px);
                    margin-left: 0px;
                }
                100% {
                    margin-top: 0px;
                    margin-left: 0px;
                }
            }

    </style>
</head>
<body>
    <div class="main">
        <div class="box">box</div>
        <div class="box1">box1</div>
        <div class="box2">box2</div>
    </div>
    </body>
</html>
