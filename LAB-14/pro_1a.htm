<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 100vh;
            width: 100vw;
            display: flex;
            gap: 100px;
        }
        .box{
            height: 500px;
            width: 500px;
            background-image: linear-gradient(red,yellow);
        }
        .box1{
            height: 500px;
            width: 500px;
            background-image: radial-gradient(red,yellow,green);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box"></div>
        <div class="box1"></div>
    </div>
</body>
</html>
