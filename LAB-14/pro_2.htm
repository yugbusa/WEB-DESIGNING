<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .main{
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background-color: darkblue;
        }
        .row1,.row2,.row3,.row4,.row5{
            display: flex;
            height: 30%;
            width: 100%;
            gap: 50px;
            justify-content: center;
            margin: 10px;
        }
        .box{
            width: 15%;
            height: 100%;
        }
        .boxa1{
            border-radius: 5px;
            background-image: linear-gradient(135deg,rgb(134, 237, 134),rgb(114, 202, 237),rgb(208, 89, 111));
        }
        .boxa2{
            border-radius: 5px;
            background-image: linear-gradient(45deg,rgb(92, 152, 236),rgb(117, 201, 229));
        }
        .boxa3{
            border-radius: 5px;
            background-image: linear-gradient(135deg,rgb(235, 152, 101),rgb(239, 107, 230),rgb(121, 109, 235));
        }
        .boxb1{
            border-radius: 5px;
            background-image: linear-gradient(135deg,rgb(235, 128, 157),rgb(231, 145, 222),rgb(231, 174, 184));
        }
        .boxb2{
            border-radius: 5px;
            background-image: linear-gradient(135deg,rgb(102, 173, 224),rgb(119, 107, 229),rgb(231, 174, 184));
        }
        .boxb3{
             border-radius: 5px;
            background-image: linear-gradient(45deg,rgb(240, 169, 87),rgb(234, 123, 82),rgb(235, 119, 237));
        }
        .boxc1{
             border-radius: 5px;
            background-image: linear-gradient(135deg,rgb(204, 112, 235),rgb(76, 122, 222),rgb(80, 168, 205));
        }
        .boxc2{
             border-radius: 5px;
            background-image: linear-gradient(135deg,rgb(220, 202, 38),rgb(206, 214, 89),rgb(222, 222, 137));
        }
        .boxc3{
             border-radius: 5px;
            background-image: linear-gradient(135deg,rgb(224, 83, 156),rgb(211, 88, 172),rgb(222, 101, 150));
        }
        .boxd1{
             border-radius: 5px;
            background-image: linear-gradient(135deg,rgb(161, 221, 161),rgb(171, 202, 214),rgb(183, 231, 174));
        }
        .boxd2{
             border-radius: 5px;
            background-image: linear-gradient(135deg,rgb(180, 180, 140),rgb(216, 116, 174),rgb(100, 173, 204));
        }
        .boxd3{
             border-radius: 5px;
            background-image: linear-gradient(rgb(230, 104, 85),rgb(234, 66, 40),rgb(225, 198, 62));
        }
        .boxe1{
            border-radius: 5px;
            background-image: linear-gradient(45deg,rgb(193, 207, 125),rgb(200, 207, 123),rgb(156, 185, 193));
        }
        .boxe2{
             border-radius: 5px;
            background-image: linear-gradient(45deg,rgb(240, 177, 100),rgb(205, 113, 224),rgb(157, 92, 237));
        }
        .boxe3{
             border-radius: 5px;
            background-image: linear-gradient(45deg,rgb(143, 228, 143),rgb(93, 192, 231),rgb(110, 133, 237));
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="row1">
            <div class="boxa1 box"></div>
            <div class="boxa2 box"></div>
            <div class="boxa3 box"></div>
        </div>
        <div class="row2">
            <div class="boxb1 box"></div>
            <div class="boxb2 box"></div>
            <div class="boxb3 box"></div>
        </div>
        <div class="row3">
            <div class="boxc1 box"></div>
            <div class="boxc2 box"></div>
            <div class="boxc3 box"></div>
        </div>
        <div class="row4">
            <div class="boxd1 box"></div>
            <div class="boxd2 box"></div>
            <div class="boxd3 box"></div>
        </div>
        <div class="row5">
            <div class="boxe1 box"></div>
            <div class="boxe2 box"></div>
            <div class="boxe3 box"></div>
        </div>
       
    </div>
</body>
</html>
